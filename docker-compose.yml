services:
  master:
    image: bitnami/postgresql:17.4.0
    container_name: pg_master
    environment:
      - POSTGRESQL_PGAUDIT_LOG=READ,WRITE
      - POSTGRESQL_LOG_HOSTNAME=true
      - POSTGRESQL_REPLICATION_MODE=master
      - POSTGRESQL_REPLICATION_USER=${POSTGRESQL_REPLICATION_USER}
      - POSTGRESQL_REPLICATION_PASSWORD=${REPLICATION_PASSWORD}
      - POSTGRESQL_USERNAME=${POSTGRES_USER}
      - POSTGRESQL_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRESQL_DATABASE=${POSTGRES_DB}
      - POSTGRESQL_EXTRA_FLAGS=--wal_level=logical
      - POSTGRESQL_ENABLE_REPLICATION=true
    volumes:
      - ${POSTGRES_WORK_DIR}/db/postgres/postgres_master_data:/bitnami/postgresql
      - ${POSTGRES_WORK_DIR}/db/postgres/postgres_master_config:/bitnami/postgresql/conf
    ports:
      - "${POSTGRES_MASTER_PORT}:5432"
    networks:
      - mynetwork
    restart: unless-stopped
   # command: >
     # /bin/bash -c "
       # /opt/bitnami/scripts/postgresql/entrypoint.sh /opt/bitnami/scripts/postgresql/run.sh &
       # until pg_isready -U postgres; do
       #   echo 'Waiting for PostgreSQL to be ready...';
      #    sleep 2;
     #   done &&
    #    PGPASSWORD=umXqrvquETnOCiPmplqEsrtau psql -U postgres -d ${POSTGRES_DB} -c 'ALTER USER postgres WITH PASSWORD ''umXqrvquETnOCiPmplqEsrtau'';' &&
  #      wait
   #   "
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  slave1:
    image: bitnami/postgresql:17.4.0
    container_name: pg_slave1
    environment:
      - POSTGRESQL_MASTER_HOST=pg_master
      - POSTGRESQL_REPLICATION_MODE=slave
      - POSTGRESQL_REPLICATION_USER=${POSTGRESQL_REPLICATION_USER}
      - POSTGRESQL_REPLICATION_PASSWORD=${REPLICATION_PASSWORD}
      - POSTGRESQL_MASTER_PORT_NUMBER=${POSTGRES_MASTER_PORT}
      - POSTGRESQL_USERNAME=${POSTGRES_USER}
      - POSTGRESQL_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRESQL_DATABASE=${POSTGRES_DB}
      - POSTGRESQL_LOG_CONNECTIONS=true
      - POSTGRESQL_LOG_DISCONNECTIONS=true
      - POSTGRESQL_ENABLE_REPLICATION=true
    volumes:
      - ${POSTGRES_WORK_DIR}/db/postgres/postgres_slave1_data:/bitnami/postgresql
    restart: unless-stopped
    depends_on:
      master:
        condition: service_healthy
    ports:
      - "${POSTGRES_SLAVE1_PORT}:5432"
    networks:
      - mynetwork
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -h pg_master -d ${POSTGRES_DB} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  mynetwork:
    driver: bridge
    external: true
